                        items:
                          $ref: '#/components/schemas/KycAttempt'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/kyc/attempts/{id}/override:
    post:
      tags: [Admin]
      summary: Manually override a KYC attempt
      description: |
