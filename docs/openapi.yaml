openapi: 3.1.0

info:
  title: FlowKey API
  version: 0.1.0
  description: |
    FlowKey — wallet-based fintech orchestration platform.
    Production-grade backend API. Nigerian Naira (NGN) only.

    ## Monetary values
    All `amount`, `fee`, and `net_amount` fields are **integers in kobo** (NGN × 100).
    The display layer converts to naira. Never send or expect floats.

    ## Authentication
    All protected endpoints require:
    ```
    Authorization: Bearer <access_token>
    ```
    Access tokens are RS256 JWTs with a 15-minute TTL.
    Refresh tokens are opaque 256-bit values, 30-day TTL.
    Both are stored in OS secure enclave (Expo SecureStore / RN Keychain) on the client.

    ## Idempotency
    All state-mutating endpoints (`POST`, `PATCH`, `DELETE` that write) require:
    ```
    Idempotency-Key: <uuid-v4>
    ```
    Generate a fresh UUID v4 per request. Reusing a key with a different payload returns HTTP 422.

    ## Response envelope
    Every response — success or error — uses this envelope:
    ```json
    {
      "success": true,
      "data": {},
      "meta": { "cursor": "...", "has_more": false },
      "error": null
    }
    ```

    ## Pagination
    All list endpoints use cursor-based pagination.
    Pass `cursor` from the previous response's `meta.cursor` to get the next page.

  contact:
    name: FlowKey Engineering

servers:
  - url: https://api.flowkey.ng/api/v1
    description: Production
  - url: https://staging-api.flowkey.ng/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Local development

# =============================================================================
# SECURITY SCHEMES
# =============================================================================

components:
  securitySchemes:
    UserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued at login. 15-minute TTL. Store in SecureStore/Keychain.

    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT issued at admin login. Contains role claim (admin | super_admin).

    WebhookHMAC:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256 signature of the raw request body using the provider webhook secret.

  # ===========================================================================
  # SHARED SCHEMAS
  # ===========================================================================

  schemas:

    # -------------------------------------------------------------------------
    # Response envelope
    # -------------------------------------------------------------------------

    SuccessResponse:
      type: object
      required: [success, data, meta, error]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        error:
          type: 'null'

    ErrorResponse:
      type: object
      required: [success, data, meta, error]
      properties:
        success:
          type: boolean
          example: false
        data:
          type: 'null'
        meta:
          type: 'null'
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: INSUFFICIENT_BALANCE
            message:
              type: string
              example: Your wallet does not have enough funds for this transaction.

    PaginationMeta:
      type: object
      nullable: true
      properties:
        cursor:
          type: string
          nullable: true
          description: Opaque cursor — pass as `cursor` param on next request.
        has_more:
          type: boolean

    # -------------------------------------------------------------------------
    # Common field types
    # -------------------------------------------------------------------------

    KoboAmount:
      type: integer
      format: int64
      minimum: 1
      description: Amount in kobo (NGN × 100). Always a positive integer. Never a float.
      example: 500000

    UuidV4:
      type: string
      format: uuid
      example: 123e4567-e89b-12d3-a456-426614174000

    PhoneNumber:
      type: string
      pattern: '^\+234[0-9]{10}$'
      example: '+2348012345678'
      description: Nigerian phone number in E.164 format.

    UniversalId:
      type: string
      pattern: '^[A-Z]+-[A-Z]+-[0-9]{4}$'
      example: SILVER-BOLT-8182
      description: FlowKey Universal ID. Format — WORD-WORD-NNNN. Always uppercase.

    KycTier:
      type: integer
      enum: [0, 1, 2, 3]
      description: |
        KYC tier level.
        0 = phone + email only
        1 = NIN verified
        2 = BVN verified
        3 = liveness + address verified

    # -------------------------------------------------------------------------
    # User
    # -------------------------------------------------------------------------

    UserProfile:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        email:
          type: string
          format: email
        display_name:
          type: string
          example: Chukwuemeka Okafor
        universal_id:
          $ref: '#/components/schemas/UniversalId'
        kyc_tier:
          $ref: '#/components/schemas/KycTier'
        account_status:
          type: string
          enum: [pending_verification, active, frozen, closed]
        has_transaction_pin:
          type: boolean
          description: Whether the user has set their transaction PIN.
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Auth / Session
    # -------------------------------------------------------------------------

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
          description: RS256 JWT. 15-minute TTL. Send as Bearer token on all authenticated requests.
        refresh_token:
          type: string
          description: Opaque 256-bit token. 30-day TTL. Store in SecureStore/Keychain. Never in AsyncStorage.
        expires_in:
          type: integer
          description: Access token TTL in seconds.
          example: 900

    DeviceSession:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        device_id:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        last_active:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        is_current:
          type: boolean
          description: True if this is the session making the request.

    # -------------------------------------------------------------------------
    # Wallet & Transactions
    # -------------------------------------------------------------------------

    WalletBalance:
      type: object
      properties:
        balance_kobo:
          $ref: '#/components/schemas/KoboAmount'
        balance_naira:
          type: string
          description: Display string. e.g. "₦5,000.00". Derived from balance_kobo.
          example: "₦5,000.00"
        wallet_id:
          $ref: '#/components/schemas/UuidV4'

    Transaction:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        type:
          type: string
          enum:
            - transfer_internal
            - transfer_bank
            - bill_payment
            - qr_payment
            - reversal
            - fee
            - funding
            - refund
        status:
          type: string
          enum: [pending, processing, completed, failed, reversed, disputed]
        amount_kobo:
          $ref: '#/components/schemas/KoboAmount'
        fee_kobo:
          type: integer
          format: int64
          minimum: 0
        net_amount_kobo:
          type: integer
          format: int64
          minimum: 0
        narration:
          type: string
          nullable: true
        reference:
          type: string
          example: FLK-20260425-A1B2C3
        direction:
          type: string
          enum: [credit, debit]
          description: From the perspective of the requesting user's wallet.
        counterparty:
          type: object
          nullable: true
          description: The other party in the transaction (masked).
          properties:
            display_name:
              type: string
            masked_id:
              type: string
              description: First and last character of Universal ID only.
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # KYC
    # -------------------------------------------------------------------------

    KycStatus:
      type: object
      properties:
        current_tier:
          $ref: '#/components/schemas/KycTier'
        next_tier:
          $ref: '#/components/schemas/KycTier'
          nullable: true
        limits:
          type: object
          properties:
            single_transaction_kobo:
              $ref: '#/components/schemas/KoboAmount'
            daily_kobo:
              $ref: '#/components/schemas/KoboAmount'
        cooldown_until:
          type: string
          format: date-time
          nullable: true
          description: If set, user must wait until this time before retrying KYC upgrade.
        last_attempt_status:
          type: string
          enum: [passed, failed, error]
          nullable: true

    KycAttempt:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        tier_target:
          type: integer
        status:
          type: string
          enum: [pending, passed, failed, error]
        failure_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Transfers
    # -------------------------------------------------------------------------

    RecipientPreview:
      type: object
      description: Safe preview of a recipient shown before PIN confirmation.
      properties:
        user_id:
          $ref: '#/components/schemas/UuidV4'
        display_name:
          type: string
          example: Amaka O.
        avatar_initial:
          type: string
          example: A
        masked_universal_id:
          type: string
          example: S****-B****-8182
          description: Partially masked Universal ID shown on confirmation screen.

    TransferConfirmation:
      type: object
      description: Full confirmation payload shown to user before PIN entry.
      properties:
        recipient:
          $ref: '#/components/schemas/RecipientPreview'
        amount_kobo:
          $ref: '#/components/schemas/KoboAmount'
        fee_kobo:
          type: integer
          format: int64
          minimum: 0
        net_amount_kobo:
          type: integer
          format: int64
          minimum: 0
        narration:
          type: string
          nullable: true
        transfer_token:
          type: string
          description: |
            Short-lived signed token (60s TTL) that authorises this specific transfer.
            Must be submitted with the PIN in the execute step.
            Prevents confirmation screen replay attacks.

    # -------------------------------------------------------------------------
    # Withdrawals
    # -------------------------------------------------------------------------

    BankAccountPreview:
      type: object
      properties:
        bank_code:
          type: string
          example: "058"
        bank_name:
          type: string
          example: GTBank
        account_number:
          type: string
          description: Last 4 digits only for display.
          example: "****3456"
        account_name:
          type: string
          example: CHUKWUEMEKA OKAFOR
        verified:
          type: boolean

    # -------------------------------------------------------------------------
    # QR
    # -------------------------------------------------------------------------

    QrCode:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        type:
          type: string
          enum: [static, dynamic]
        payload:
          type: string
          description: The raw QR payload string. Encode this as a QR image on the client.
        amount_kobo:
          $ref: '#/components/schemas/KoboAmount'
          nullable: true
        narration:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Null for static QR. 24h from creation for dynamic QR.
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Beneficiaries
    # -------------------------------------------------------------------------

    Beneficiary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        type:
          type: string
          enum: [internal, bank]
        nickname:
          type: string
          nullable: true
        recipient_name:
          type: string
        masked_identifier:
          type: string
          description: Masked Universal ID (internal) or masked account number (bank).
        bank_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Payment Requests
    # -------------------------------------------------------------------------

    PaymentRequest:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        sender:
          $ref: '#/components/schemas/RecipientPreview'
        receiver:
          $ref: '#/components/schemas/RecipientPreview'
        amount_kobo:
          $ref: '#/components/schemas/KoboAmount'
        narration:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, paid, declined, expired, cancelled]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Notifications
    # -------------------------------------------------------------------------

    Notification:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        channel:
          type: string
          enum: [push, email, sms]
        event_type:
          type: string
          example: transaction.completed
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [pending, delivered, failed]
        created_at:
          type: string
          format: date-time

    NotificationPrefs:
      type: object
      properties:
        push_transactions:
          type: boolean
        email_transactions:
          type: boolean
        sms_transactions:
          type: boolean
        push_marketing:
          type: boolean
        email_marketing:
          type: boolean
        push_security:
          type: boolean
          description: Cannot be set to false. Always true.
          readOnly: true
        email_security:
          type: boolean
          description: Cannot be set to false. Always true.
          readOnly: true

    # -------------------------------------------------------------------------
    # Receipts
    # -------------------------------------------------------------------------

    Receipt:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        transaction_id:
          $ref: '#/components/schemas/UuidV4'
        reference:
          type: string
        type:
          type: string
        amount_kobo:
          $ref: '#/components/schemas/KoboAmount'
        fee_kobo:
          type: integer
          format: int64
        net_amount_kobo:
          type: integer
          format: int64
        narration:
          type: string
          nullable: true
        sender_masked:
          type: string
          description: First and last character of sender display name only.
        recipient_masked:
          type: string
          description: First and last character of recipient display name only.
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        download_url:
          type: string
          description: HMAC-signed, time-limited PDF download URL. 72h TTL.
          nullable: true
        public_url:
          type: string
          description: Publicly accessible verification URL. Cryptographically unguessable.

    # -------------------------------------------------------------------------
    # Disputes
    # -------------------------------------------------------------------------

    Dispute:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        transaction_id:
          $ref: '#/components/schemas/UuidV4'
        status:
          type: string
          enum: [open, closed_no_action, reversed, escalated]
        reason_category:
          type: string
        description:
          type: string
        resolution_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Bot
    # -------------------------------------------------------------------------

    BotSession:
      type: object
      properties:
        session_id:
          $ref: '#/components/schemas/UuidV4'
        state:
          type: string
          enum:
            - idle
            - intent_captured
            - structured_command
            - awaiting_confirmation
            - pin_entry
            - executing
            - completed
            - failed
        expires_at:
          type: string
          format: date-time
        intent_count:
          type: integer
          description: Number of transaction intents used. Max 5 per session.

    BotMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        timestamp:
          type: string
          format: date-time
        action:
          type: object
          nullable: true
          description: Structured command payload when the bot proposes a transaction.
          properties:
            type:
              type: string
              enum: [transfer_preview, confirmation_required, pin_required, completed, failed]
            payload:
              type: object

    # -------------------------------------------------------------------------
    # Settings
    # -------------------------------------------------------------------------

    UserSettings:
      type: object
      properties:
        profile:
          type: object
          properties:
            display_name:
              type: string
            phone:
              $ref: '#/components/schemas/PhoneNumber'
            email:
              type: string
              format: email
        notification_prefs:
          $ref: '#/components/schemas/NotificationPrefs'
        has_transaction_pin:
          type: boolean
        active_sessions_count:
          type: integer

    # -------------------------------------------------------------------------
    # Admin
    # -------------------------------------------------------------------------

    AdminUserSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        phone:
          type: string
        email:
          type: string
        display_name:
          type: string
        universal_id:
          $ref: '#/components/schemas/UniversalId'
        kyc_tier:
          $ref: '#/components/schemas/KycTier'
        account_status:
          type: string
          enum: [pending_verification, active, frozen, closed]
        created_at:
          type: string
          format: date-time

    AdminTransactionSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        type:
          type: string
        status:
          type: string
        amount_kobo:
          $ref: '#/components/schemas/KoboAmount'
        fee_kobo:
          type: integer
          format: int64
        reference:
          type: string
        initiator_id:
          $ref: '#/components/schemas/UuidV4'
        initiator_type:
          type: string
          enum: [user, system, admin, terminal, bot]
        created_at:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UuidV4'
        actor_id:
          $ref: '#/components/schemas/UuidV4'
          nullable: true
        actor_type:
          type: string
          enum: [user, admin, system]
        action:
          type: string
        target_type:
          type: string
          nullable: true
        target_id:
          $ref: '#/components/schemas/UuidV4'
          nullable: true
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

  # ===========================================================================
  # SHARED PARAMETERS
  # ===========================================================================

  parameters:

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/UuidV4'
      description: |
        Client-generated UUID v4. Generate fresh per request.
        Reusing a key with a different payload returns HTTP 422.

    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Pagination cursor from previous response meta.cursor.

    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  # ===========================================================================
  # SHARED RESPONSES
  # ===========================================================================

  responses:

    Unauthorized:
      description: Missing, invalid, or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            meta: null
            error:
              code: INVALID_TOKEN
              message: Your session has expired. Please log in again.

    Forbidden:
      description: Authenticated but not authorised for this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Validation error or business rule violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            meta: null
            error:
              code: RATE_LIMITED
              message: Too many requests. Please wait before trying again.

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Unexpected server error. No internal details exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# =============================================================================
# TAGS
# =============================================================================

tags:
  - name: Auth
    description: Registration, login, session lifecycle, OTP verification.
  - name: KYC
    description: Tier upgrades and identity verification status.
  - name: Wallet
    description: Balance and transaction history.
  - name: Transfers
    description: FlowKey-to-FlowKey internal transfers.
  - name: Withdrawals
    description: Bank withdrawals via Providus.
  - name: Bills
    description: Bill payments via aggregator.
  - name: QR
    description: QR code generation and scan-to-pay.
  - name: Payment Requests
    description: Request money from another FlowKey user.
  - name: Beneficiaries
    description: Saved recipients for fast repeat transfers.
  - name: Notifications
    description: Notification history.
  - name: Receipts
    description: Transaction receipts — authenticated and public.
  - name: Disputes
    description: User-initiated dispute lifecycle.
  - name: Bot
    description: Conversational transaction interface.
  - name: Settings
    description: Profile, security, session management, account.
  - name: Admin
    description: Internal admin operations. Requires AdminAuth.
  - name: Webhooks
    description: Inbound provider webhooks. Called by providers, not the mobile client.

# =============================================================================
# PATHS
# =============================================================================

paths:

  # ===========================================================================
  # AUTH
  # ===========================================================================

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user account
      description: |
        Creates a new user in `pending_verification` status.
        Sends phone OTP via SMS and email OTP to the provided addresses.
        Both OTPs must be verified before the account becomes active.
      operationId: registerUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, email, display_name, login_passcode, device_id, fcm_token]
              properties:
                phone:
                  $ref: '#/components/schemas/PhoneNumber'
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                  minLength: 2
                  maxLength: 100
                login_passcode:
                  type: string
                  pattern: '^\d{6}$'
                  description: 6-digit numeric passcode. Hashed with Argon2id server-side. Never stored in plaintext.
                device_id:
                  type: string
                  description: Client-generated stable device identifier. Stored in SecureStore. Never changes per install.
                fcm_token:
                  type: string
                  description: Firebase Cloud Messaging token for push notifications.
      responses:
        '201':
          description: Registration initiated. OTPs sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user_id:
                            $ref: '#/components/schemas/UuidV4'
                          message:
                            type: string
                            example: Verification codes sent to your phone and email.
                          phone_otp_expires_at:
                            type: string
                            format: date-time
                          email_otp_expires_at:
                            type: string
                            format: date-time
        '409':
          description: Phone or email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                phone_taken:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: PHONE_ALREADY_REGISTERED
                      message: An account with this phone number already exists.
                email_taken:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: EMAIL_ALREADY_REGISTERED
                      message: An account with this email address already exists.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/verify-phone:
    post:
      tags: [Auth]
      summary: Verify phone number with OTP
      operationId: verifyPhone
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, otp]
              properties:
                user_id:
                  $ref: '#/components/schemas/UuidV4'
                otp:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Phone verified successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          phone_verified:
                            type: boolean
                            example: true
        '422':
          description: OTP invalid, expired, or max attempts exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: OTP_INVALID
                      message: The code you entered is incorrect.
                expired:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: OTP_EXPIRED
                      message: This code has expired. Please request a new one.
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/resend-phone-otp:
    post:
      tags: [Auth]
      summary: Resend phone OTP
      description: Rate limited to 3 resends within 30 minutes.
      operationId: resendPhoneOtp
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: OTP resent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expires_at:
                            type: string
                            format: date-time
        '429':
          description: Resend limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                meta: null
                error:
                  code: OTP_RESEND_LIMIT_EXCEEDED
                  message: Too many resend attempts. Please wait before trying again.

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address with OTP
      operationId: verifyEmail
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, otp]
              properties:
                user_id:
                  $ref: '#/components/schemas/UuidV4'
                otp:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Email verified. If phone is also verified, account becomes active and tokens are issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          email_verified:
                            type: boolean
                          account_active:
                            type: boolean
                            description: True when both phone and email are verified.
                          tokens:
                            $ref: '#/components/schemas/AuthTokens'
                            nullable: true
                            description: Issued only when account_active becomes true.
                          user:
                            $ref: '#/components/schemas/UserProfile'
                            nullable: true
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/resend-email-otp:
    post:
      tags: [Auth]
      summary: Resend email OTP
      description: Rate limited to 3 resends within 30 minutes.
      operationId: resendEmailOtp
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: OTP resent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expires_at:
                            type: string
                            format: date-time
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with phone and passcode
      operationId: loginUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, login_passcode, device_id, fcm_token]
              properties:
                phone:
                  $ref: '#/components/schemas/PhoneNumber'
                login_passcode:
                  type: string
                  pattern: '^\d{6}$'
                device_id:
                  type: string
                fcm_token:
                  type: string
                  description: FCM token upserted on device_session for push delivery.
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tokens:
                            $ref: '#/components/schemas/AuthTokens'
                          user:
                            $ref: '#/components/schemas/UserProfile'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                meta: null
                error:
                  code: INVALID_CREDENTIALS
                  message: Incorrect phone number or passcode.
        '403':
          description: Account locked or frozen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                locked:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: PASSCODE_LOCKED
                      message: Your account is temporarily locked. Try again in 15 minutes.
                frozen:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: ACCOUNT_FROZEN
                      message: Your account has been frozen. Please contact support.
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Issues a new access + refresh token pair.
        The old refresh token is immediately invalidated (rotation).
        Presenting an already-rotated refresh token is treated as session compromise —
        the entire session family is revoked and re-login is required.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token, device_id]
              properties:
                refresh_token:
                  type: string
                device_id:
                  type: string
      responses:
        '200':
          description: New token pair issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out current session
      description: Revokes the current device session. The refresh token is immediately invalidated.
      operationId: logoutUser
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          logged_out:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out all sessions
      description: Revokes all device sessions for this user across all devices.
      operationId: logoutAllSessions
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: All sessions revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessions_revoked:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getMe
      security:
        - UserAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # KYC
  # ===========================================================================

  /kyc/status:
    get:
      tags: [KYC]
      summary: Get KYC tier status and limits
      operationId: getKycStatus
      security:
        - UserAuth: []
      responses:
        '200':
          description: Current KYC status.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KycStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /kyc/upgrade:
    post:
      tags: [KYC]
      summary: Initiate KYC tier upgrade
      description: |
        Submits identity data for verification via Prembly.
        Tier 1 requires NIN. Tier 2 requires BVN. Tier 3 requires liveness + address.
        Tiers must be completed in sequence — cannot skip.
        A 24h cooldown applies after a failed NIN attempt. 48h for BVN.
        No cooldown on provider errors (Prembly timeout/5xx).
      operationId: upgradeKyc
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier_target, identity_data]
              properties:
                tier_target:
                  type: integer
                  enum: [1, 2, 3]
                identity_data:
                  type: object
                  description: |
                    Tier 1: { nin: "12345678901" }
                    Tier 2: { bvn: "12345678901" }
                    Tier 3: { liveness_token: "...", address: { ... } }
                  additionalProperties: true
      responses:
        '202':
          description: Verification initiated. Processing asynchronously.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          attempt_id:
                            $ref: '#/components/schemas/UuidV4'
                          message:
                            type: string
                            example: Identity verification in progress. You will be notified of the result.
        '403':
          description: Tier sequence violation or cooldown active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sequence:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: KYC_TIER_SEQUENCE_VIOLATION
                      message: You must complete Tier 1 before upgrading to Tier 2.
                cooldown:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: KYC_COOLDOWN_ACTIVE
                      message: Please wait before trying again.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /kyc/attempts:
    get:
      tags: [KYC]
      summary: List KYC verification attempts
      operationId: listKycAttempts
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: KYC attempt history.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/KycAttempt'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # WALLET
  # ===========================================================================

  /wallet/balance:
    get:
      tags: [Wallet]
      summary: Get wallet balance
      description: |
        Returns derived balance from the double-entry ledger.
        Balance is never read from a cached column — always computed from ledger_entries.
        Redis cache may serve as read layer but ledger is always source of truth.
      operationId: getBalance
      security:
        - UserAuth: []
      responses:
        '200':
          description: Current wallet balance.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WalletBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: List wallet transactions
      operationId: listTransactions
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: type
          in: query
          schema:
            type: string
            enum:
              - transfer_internal
              - transfer_bank
              - bill_payment
              - qr_payment
              - reversal
              - funding
              - refund
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed, reversed, disputed]
      responses:
        '200':
          description: Paginated transaction list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # TRANSFERS
  # ===========================================================================

  /transfers/resolve-recipient:
    post:
      tags: [Transfers]
      summary: Resolve a recipient by username or Universal ID
      description: |
        Timing-safe lookup — response time and shape are identical whether
        the recipient exists or not. This prevents enumeration attacks.
        Returns a transfer_token valid for 60 seconds if recipient is found.
        The transfer_token must be submitted with the PIN in /transfers/internal.
      operationId: resolveRecipient
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
                  description: Username or Universal ID (WORD-WORD-NNNN). Case-insensitive.
                  example: SILVER-BOLT-8182
                amount_kobo:
                  $ref: '#/components/schemas/KoboAmount'
                  description: Intended amount. Used to pre-check tier limits and balance.
                narration:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: |
            Recipient found. Returns confirmation payload and short-lived transfer_token.
            If recipient does not exist, returns the same 200 shape with recipient: null
            (enumeration prevention — identical response time and status code).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TransferConfirmation'
                        nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'

  /transfers/internal:
    post:
      tags: [Transfers]
      summary: Execute an internal FlowKey-to-FlowKey transfer
      description: |
        Requires a valid transfer_token from /transfers/resolve-recipient
        and the user's 4-digit Transaction PIN.
        Executes synchronously — funds move atomically in a single DB transaction.
        Ledger entries are written under pessimistic lock (SELECT FOR UPDATE).
      operationId: executeInternalTransfer
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transfer_token, transaction_pin, amount_kobo]
              properties:
                transfer_token:
                  type: string
                  description: Short-lived token from /transfers/resolve-recipient. 60s TTL.
                transaction_pin:
                  type: string
                  pattern: '^\d{4}$'
                  description: User 4-digit Transaction PIN. Never stored — verified then discarded.
                amount_kobo:
                  $ref: '#/components/schemas/KoboAmount'
                narration:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Transfer completed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: PIN incorrect, locked, or tier insufficient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Insufficient balance, limit exceeded, or invalid transfer_token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                insufficient:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: INSUFFICIENT_BALANCE
                      message: Your wallet does not have enough funds for this transfer.
                limit:
                  value:
                    success: false
                    data: null
                    meta: null
                    error:
                      code: TRANSACTION_LIMIT_EXCEEDED
                      message: This transfer exceeds your single-transaction limit.
        '429':
          $ref: '#/components/responses/RateLimited'

  /transfers/{id}:
    get:
      tags: [Transfers]
      summary: Get transfer by ID
      operationId: getTransfer
      security:
        - UserAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: Transfer details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # WITHDRAWALS
  # ===========================================================================

  /withdrawals/verify-account:
    post:
      tags: [Withdrawals]
      summary: Verify a bank account via name enquiry
      description: |
        Calls Providus name enquiry API. Result cached for 7 days.
        Requires Tier 1+.
      operationId: verifyBankAccount
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, account_number]
              properties:
                bank_code:
                  type: string
                  example: "058"
                account_number:
                  type: string
                  pattern: '^\d{10}$'
      responses:
        '200':
          description: Account verified.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BankAccountPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: KYC tier insufficient (requires Tier 1+).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Account not found or bank unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Providus name enquiry service temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /withdrawals:
    post:
      tags: [Withdrawals]
      summary: Initiate a bank withdrawal
      description: |
        Debits the user wallet immediately.
        Execution is async — transaction status starts as `processing`.
        Final status is set when Providus webhook is received.
        Requires Tier 1+.
      operationId: initiateWithdrawal
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_code, account_number, amount_kobo, transaction_pin]
              properties:
                bank_code:
                  type: string
                account_number:
                  type: string
                  pattern: '^\d{10}$'
                amount_kobo:
                  $ref: '#/components/schemas/KoboAmount'
                narration:
                  type: string
                  maxLength: 255
                transaction_pin:
                  type: string
                  pattern: '^\d{4}$'
      responses:
        '202':
          description: Withdrawal initiated. Processing asynchronously.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /withdrawals/{id}:
    get:
      tags: [Withdrawals]
      summary: Get withdrawal status by ID
      operationId: getWithdrawal
      security:
        - UserAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: Withdrawal details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # BILLS
  # x-status: pending-aggregator-confirmation
  # Field names in requestBody are placeholders — confirmed when Phase 10 begins.
  # ===========================================================================

  /bills/validate:
    post:
      tags: [Bills]
      summary: Validate a bill payment before execution
      description: |
        Validates the bill details with the aggregator before charging the user.
        x-status: pending-aggregator-confirmation — request shape may change.
      operationId: validateBill
      x-status: pending-aggregator-confirmation
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bill_type, biller_id, customer_id, amount_kobo]
              properties:
                bill_type:
                  type: string
                  example: electricity
                  description: e.g. electricity, airtime, data, cable_tv
                biller_id:
                  type: string
                  description: Aggregator-specific biller identifier.
                customer_id:
                  type: string
                  description: Customer meter number, phone number, smart card number, etc.
                amount_kobo:
                  $ref: '#/components/schemas/KoboAmount'
      responses:
        '200':
          description: Bill validated. Returns confirmation payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          customer_name:
                            type: string
                          biller_name:
                            type: string
                          amount_kobo:
                            $ref: '#/components/schemas/KoboAmount'
                          fee_kobo:
                            type: integer
                            format: int64
                          validation_token:
                            type: string
                            description: Short-lived token authorising this specific bill payment. 60s TTL.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bills/pay:
    post:
      tags: [Bills]
      summary: Execute a bill payment
      operationId: payBill
      x-status: pending-aggregator-confirmation
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [validation_token, transaction_pin]
              properties:
                validation_token:
                  type: string
                  description: Token from /bills/validate. 60s TTL.
                transaction_pin:
                  type: string
                  pattern: '^\d{4}$'
      responses:
        '202':
          description: Bill payment initiated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /bills/{id}:
    get:
      tags: [Bills]
      summary: Get bill payment status by ID
      operationId: getBillPayment
      security:
        - UserAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: Bill payment details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Transaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # QR
  # ===========================================================================

  /qr/generate:
    post:
      tags: [QR]
      summary: Generate a QR code for receiving payment
      description: |
        Static QR — no expiry, tied to user profile.
        Dynamic QR — fixed amount, 24h expiry.
        Payload is HMAC-SHA256 signed to prevent forgery.
      operationId: generateQr
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [static, dynamic]
                amount_kobo:
                  $ref: '#/components/schemas/KoboAmount'
                  description: Required for dynamic QR. Omit for static.
                narration:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: QR code generated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QrCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /qr/decode:
    post:
      tags: [QR]
      summary: Decode and validate a scanned QR payload
      description: |
        Verifies the HMAC signature on the QR payload.
        Returns the transfer confirmation payload if valid.
        The client scans the QR, sends the raw payload here.
      operationId: decodeQr
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: Raw QR string from scanner.
                amount_kobo:
                  $ref: '#/components/schemas/KoboAmount'
                  description: Required if QR is static (open-amount). Ignored for dynamic QR.
      responses:
        '200':
          description: QR valid. Returns transfer confirmation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TransferConfirmation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid or expired QR payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /qr/{id}:
    get:
      tags: [QR]
      summary: Get QR code by ID
      operationId: getQrCode
      security:
        - UserAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: QR code details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QrCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

