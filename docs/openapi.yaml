  /settings/passcode/change:
    post:
      tags: [Settings]
      summary: Change login passcode
      description: |
        Requires current passcode for re-authentication before accepting new passcode.
        Triggers a security notification on success.
      operationId: changePasscode
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_passcode, new_passcode]
              properties:
                current_passcode:
                  type: string
                  pattern: '^\d{6}$'
                new_passcode:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Passcode changed. All other sessions revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessions_revoked:
                            type: integer
                            description: Number of other sessions revoked for security.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current passcode incorrect or account locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /settings/passcode/forgot:
    post:
      tags: [Settings]
      summary: Initiate forgot passcode recovery
      description: |
        Sends a 6-digit OTP to both the registered phone (SMS) and email.
        Both must be verified via /settings/passcode/reset before a new passcode is accepted.
      operationId: forgotPasscode
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/PhoneNumber'
      responses:
        '200':
          description: Recovery OTPs sent to phone and email.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reset_token:
                            type: string
                            description: Short-lived token (15 min) to be submitted with the OTPs in /settings/passcode/reset.
                          expires_at:
                            type: string
                            format: date-time
        '404':
          description: Phone number not registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                meta: null
                error:
                  code: NOT_FOUND
                  message: No account found with that phone number.
        '429':
          $ref: '#/components/responses/RateLimited'

  /settings/passcode/reset:
    post:
      tags: [Settings]
      summary: Reset passcode with OTP verification
      description: |
        Submits both phone OTP and email OTP along with the reset_token from /settings/passcode/forgot.
        All three must be valid to set a new passcode.
        All active sessions are revoked on success.
      operationId: resetPasscode
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, phone_otp, email_otp, new_passcode]
              properties:
                reset_token:
                  type: string
                phone_otp:
                  type: string
                  pattern: '^\d{6}$'
                email_otp:
                  type: string
                  pattern: '^\d{6}$'
                new_passcode:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Passcode reset. All sessions revoked. New tokens issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tokens:
                            $ref: '#/components/schemas/AuthTokens'
        '422':
          description: Invalid or expired OTP or reset token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /settings/pin/set:
    post:
      tags: [Settings]
      summary: Set transaction PIN for the first time
      description: |
        Only available if the user has no transaction PIN yet.
        Requires current login passcode for re-authentication.
      operationId: setTransactionPin
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_passcode, transaction_pin]
              properties:
                login_passcode:
                  type: string
                  pattern: '^\d{6}$'
                transaction_pin:
                  type: string
                  pattern: '^\d{4}$'
      responses:
        '200':
          description: Transaction PIN set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          pin_set:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Passcode incorrect or PIN already set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /settings/pin/change:
    post:
      tags: [Settings]
      summary: Change transaction PIN
      description: Requires current transaction PIN for re-authentication.
      operationId: changeTransactionPin
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_pin, new_pin]
              properties:
                current_pin:
                  type: string
                  pattern: '^\d{4}$'
                new_pin:
                  type: string
                  pattern: '^\d{4}$'
      responses:
        '200':
          description: Transaction PIN changed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          changed:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Current PIN incorrect or locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /settings/pin:
    delete:
      tags: [Settings]
      summary: Remove transaction PIN
      description: Requires current login passcode for re-authentication.
      operationId: deleteTransactionPin
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_passcode]
              properties:
                login_passcode:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        '200':
          description: Transaction PIN removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings/sessions:
    get:
      tags: [Settings]
      summary: List active device sessions
      operationId: listSessions
      security:
        - UserAuth: []
      responses:
        '200':
          description: Active sessions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeviceSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/sessions/{id}:
    delete:
      tags: [Settings]
      summary: Revoke a specific device session
      description: Cannot revoke the current session — use /auth/logout for that.
      operationId: revokeSession
      security:
        - UserAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot revoke current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /settings/account:
    delete:
      tags: [Settings]
      summary: Close account
      description: |
        Soft-deletes the user account. Requires login passcode confirmation.
        Any outstanding balance must be zero before closure is permitted.
        All sessions are revoked immediately.
        This action is irreversible from the user side — requires admin intervention to undo.
      operationId: closeAccount
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_passcode, reason]
              properties:
                login_passcode:
                  type: string
                  pattern: '^\d{6}$'
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Account closed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          closed:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Passcode incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Account has outstanding balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                meta: null
                error:
                  code: CONFLICT
                  message: Your wallet must have a zero balance before closing your account.

  # ===========================================================================
  # ADMIN
  # All endpoints require AdminAuth. Role enforcement noted per endpoint.
  # ===========================================================================

  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      operationId: adminListUsers
      security:
        - AdminAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: account_status
          in: query
          schema:
            type: string
            enum: [pending_verification, active, frozen, closed]
        - name: kyc_tier
          in: query
          schema:
            type: integer
            enum: [0, 1, 2, 3]
        - name: search
          in: query
          schema:
            type: string
          description: Search by phone, email, display name, or Universal ID.
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminUserSummary'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{id}:
