  # ===========================================================================
  # BOT
  # x-status: scaffolded — LLM integration pending (Phase 16)
  # ===========================================================================

  /bot/sessions:
    post:
      tags: [Bot]
      summary: Start a new bot session
      description: |
        Creates a new conversational session. 15-minute inactivity TTL.
        Max 5 transaction intents per session.
        Available at Tier 0.
        x-status: scaffolded — LLM integration pending Phase 16.
      operationId: createBotSession
      x-status: scaffolded
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Bot session created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bot/sessions/{id}/message:
    post:
      tags: [Bot]
      summary: Send a message in a bot session
      description: |
        Sends a user message and receives the bot reply.
        The bot NEVER executes a transaction from raw text.
        Flow: text → parsed intent → structured command → confirmation → PIN → execute.
        PIN confirmation is handled here — the client sends the PIN in the pin_response field
        when state is `pin_entry`.
      operationId: sendBotMessage
      x-status: scaffolded
      security:
        - UserAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4'
          description: Bot session ID.
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: User's message text.
                  maxLength: 1000
                pin_response:
                  type: string
                  pattern: '^\d{4}$'
                  description: |
                    Transaction PIN. Only required when session state is `pin_entry`.
                    Must never be sent in any other state.
                confirmation:
                  type: boolean
                  description: |
                    Explicit user confirmation. Only valid when state is `awaiting_confirmation`.
      responses:
        '200':
          description: Bot reply.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          session:
                            $ref: '#/components/schemas/BotSession'
                          message:
                            $ref: '#/components/schemas/BotMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Intent limit exceeded or invalid state transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

