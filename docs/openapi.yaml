        '404':
          $ref: '#/components/responses/NotFound'

  /admin/transactions:
    get:
      tags: [Admin]
      summary: List all transactions
      operationId: adminListTransactions
      security:
        - AdminAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed, reversed, disputed]
        - name: type
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: Transaction list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminTransactionSummary'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/transactions/{id}:
    get:
      tags: [Admin]
      summary: Get transaction detail
      operationId: adminGetTransaction
      security:
        - AdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: Full transaction detail including ledger entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/AdminTransactionSummary'
                          - type: object
                            properties:
                              ledger_entries:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      $ref: '#/components/schemas/UuidV4'
                                    wallet_id:
                                      $ref: '#/components/schemas/UuidV4'
                                    type:
                                      type: string
                                      enum: [credit, debit]
                                    amount_kobo:
                                      $ref: '#/components/schemas/KoboAmount'
                                    created_at:
                                      type: string
                                      format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/transactions/{id}/reverse:
    post:
      tags: [Admin]
      summary: Reverse a completed transaction
      description: |
        Creates a compensating transaction (type: reversal) with two new ledger entries.
        Original transaction status → reversed.
        Both parties notified.
        Bill payments are not reversible.
        Requires super_admin role.
      operationId: adminReverseTransaction
      security:
        - AdminAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UuidV4'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code, note]
              properties:
                reason_code:
                  type: string
                  enum:
                    - fraud
                    - error
                    - dispute_resolved
                    - compliance
                    - other
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Transaction reversed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reversal_transaction_id:
                            $ref: '#/components/schemas/UuidV4'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Requires super_admin role or transaction type is not reversible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Transaction not in completed state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/kyc/attempts:
    get:
      tags: [Admin]
