# =============================================================================
# WEBHOOKS — inbound from providers, not called by mobile client
# =============================================================================

  /webhooks/v1/providus:
    post:
      tags: [Webhooks]
      summary: Inbound Providus webhook
      description: |
        Called by Providus to deliver disbursement result events.
        HMAC-SHA256 signature verified before any processing.
        HTTP handler returns 200 immediately — no DB writes in handler.
        Processing is async via BullMQ worker.
      operationId: providusWebhook
      security:
        - WebhookHMAC: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Providus webhook payload — exact shape confirmed in Phase 9.
              additionalProperties: true
      responses:
