                    properties:
                      data:
                        type: object
                        properties:
                          frozen:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
