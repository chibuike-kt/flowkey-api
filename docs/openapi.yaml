  /receipts/public/{token}:
    get:
      tags: [Receipts]
      summary: Get receipt by public token (unauthenticated)
      description: |
        No authentication required. URL is cryptographically unguessable (UUID v4 token).
        Returns machine-readable transaction summary for public verification.
        Sender and recipient names are masked.
      operationId: getPublicReceipt
      parameters:
        - name: token
          in: path
          required: true
