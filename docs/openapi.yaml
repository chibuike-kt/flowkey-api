      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id, reason_category, description]
              properties:
                transaction_id:
                  $ref: '#/components/schemas/UuidV4'
                reason_category:
                  type: string
                  enum:
                    - unauthorized_transaction
                    - amount_incorrect
                    - transaction_not_received
                    - duplicate_charge
                    - other
                description:
                  type: string
                  minLength: 10
                  maxLength: 1000
      responses:
        '201':
          description: Dispute created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dispute'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Dispute already exists for this transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags: [Disputes]
      summary: List user disputes
      operationId: listDisputes
      security:
        - UserAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed_no_action, reversed, escalated]
      responses:
        '200':
          description: Dispute list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dispute'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
        '401':
