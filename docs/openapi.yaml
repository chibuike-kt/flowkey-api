      operationId: adminListKycAttempts
      security:
        - AdminAuth: []
      parameters:
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, passed, failed, error]
        - name: user_id
          in: query
          schema:
            $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: KYC attempt list.
